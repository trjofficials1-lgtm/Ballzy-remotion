
name: Render BALLZY Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npx remotion render src/index.jsx BallzyPromo ballzy-promo.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: BALLZY-Promo-Video
          path: ballzy-promo.mp4
          
